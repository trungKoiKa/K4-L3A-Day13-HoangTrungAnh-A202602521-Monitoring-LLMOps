alerts:
  - name: slow-responses
    severity: critical
    condition: latency_p95_ms > 3000
    duration: 10m
    type: symptom-based
    channel: slack
    owner: llmops-oncall
    runbook: docs/alerts.md#slow-responses
  - name: elevated-request-failures
    severity: critical
    condition: error_rate_pct > 2
    duration: 5m
    type: symptom-based
    channel: slack
    owner: llmops-oncall
    runbook: docs/alerts.md#elevated-request-failures
  - name: quality-regression
    severity: warning
    condition: quality_score_avg < 0.75
    duration: 15m
    type: symptom-based
    channel: slack
    owner: product-llmops
    runbook: docs/alerts.md#quality-regression
